monorepo_root = true

[tools]
node = "26.8.1"
pnpm = "11.25.0"
lefthook = "2.1.12"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.65.0"
"npm:@commitlint/cli" = "21.2.2"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["apps/web", "packages/core"]

[tasks.deps]
description = "Install workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Run the web development server"
run = { task = "//apps/web:dev" }

[tasks.build]
description = "Build the core package and the web app"
depends = ["//packages/core:build", "//apps/web:build"]

[tasks.deploy]
description = "Deploy the web app to Cloudflare Workers"
depends = ["build"]
run = { task = "//apps/web:deploy" }

[tasks.test]
description = "Run every package's tests"
depends = ["//packages/core:test"]

[tasks.typecheck]
description = "Type-check every package"
depends = ["//packages/core:typecheck", "//apps/web:typecheck"]

[tasks.lint]
description = "Lint every package"
depends = ["//packages/core:lint", "//apps/web:lint"]

[tasks.lint-fix]
description = "Lint every package and apply fixes"
depends = ["//packages/core:lint-fix", "//apps/web:lint-fix"]

[tasks.format]
description = "Format the whole repository"
run = "oxfmt ."

[tasks.fmt-check]
description = "Check formatting across the whole repository"
run = "oxfmt --check ."

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.clean]
description = "Remove build output from every package"
depends = ["//packages/core:clean", "//apps/web:clean"]

[hooks]
postinstall = "lefthook install"
