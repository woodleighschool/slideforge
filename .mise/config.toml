monorepo_root = true

[tools]
node = "26.13.0"
pnpm = "12.17.0"
lefthook = "2.2.2"
jactionlint = "2.4.0"
oxfmt = "0.75.0"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["apps/web", "packages/core"]

[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.check]
depends = ["fmt-check", "lint", "test", "build"]

[tasks.dev]
run = { task = "//apps/web:dev" }

[tasks.build]
description = "Type-check the core package and build the web app"
depends = ["//packages/core:typecheck", "//apps/web:build"]

[tasks.deploy]
description = "Build and deploy the web app to Cloudflare Workers"
depends = ["build"]
run = { task = "//apps/web:deploy" }

[tasks.test]
description = "Test the core package"
depends = ["//packages/core:test"]

[tasks.typecheck]
depends = ["//packages/core:typecheck", "//apps/web:typecheck"]

[tasks.lint]
depends = ["//packages/core:lint", "//apps/web:lint"]

[tasks.lint-fix]
depends = ["//packages/core:lint-fix", "//apps/web:lint-fix"]

[tasks.format]
run = "oxfmt ."

[tasks.fmt-check]
run = "oxfmt --check ."

[tasks.clean]
depends = ["//packages/core:clean", "//apps/web:clean"]

[hooks]
postinstall = "lefthook install"
