[tasks.dev]
description = "Generate Worker types and start the development server"
depends = ["//:deps"]
run = "pnpm run dev"

[tasks.build]
description = "Generate Worker types and build the app"
depends = ["//:deps"]
run = "pnpm run build"

[tasks.serve]
description = "Serve the production build"
depends = ["//:deps"]
run = "pnpm run preview"

[tasks.deploy]
description = "Deploy the web app to Cloudflare Workers"
depends = ["//:deps"]
run = "pnpm run deploy"

[tasks.lint]
description = "Lint and type-check"
depends = ["//:deps"]
run = "pnpm run lint"

[tasks.lint-fix]
description = "Fix lint issues and type-check"
depends = ["//:deps"]
run = "pnpm run lint:fix"

[tasks.typecheck]
description = "Generate Worker types and type-check"
depends = ["//:deps"]
run = "pnpm run typecheck"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "oxfmt --check ."

[tasks.types]
description = "Regenerate Cloudflare Worker types"
depends = ["//:deps"]
run = "pnpm run types"

[tasks.clean]
description = "Remove build output and Wrangler state"
run = "rm -rf dist .wrangler"
