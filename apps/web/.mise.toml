[tasks.dev]
depends = ["//:deps"]
run = "pnpm run dev"

[tasks.build]
depends = ["//:deps"]
run = "pnpm run build"

[tasks.serve]
depends = ["//:deps"]
run = "pnpm run preview"

[tasks.deploy]
depends = ["//:deps"]
run = "pnpm run deploy"

[tasks.lint]
depends = ["//:deps"]
run = "pnpm run lint"

[tasks.lint-fix]
depends = ["//:deps"]
run = "pnpm run lint:fix"

[tasks.typecheck]
description = "Regenerates Worker types"
depends = ["//:deps"]
run = "pnpm run typecheck"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "oxfmt --check ."

[tasks.types]
depends = ["//:deps"]
run = "pnpm run types"

[tasks.clean]
run = "rm -rf dist .wrangler"
