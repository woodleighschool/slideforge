[tasks.test]
depends = ["//:deps"]
run = "pnpm run test"

[tasks.typecheck]
depends = ["//:deps"]
run = "pnpm run typecheck"

[tasks.lint]
depends = ["//:deps"]
run = "pnpm run lint"

[tasks.lint-fix]
depends = ["//:deps"]
run = "pnpm run lint:fix"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "pnpm run format:check"

[tasks.clean]
description = "Remove TypeScript and Vitest caches"
run = "rm -rf node_modules/.tmp .vitest"
